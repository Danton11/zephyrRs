[package]
name = "zephyrRS"
version = "0.1.0"
edition = "2021"


[profile.release]
panic = "abort"


[dependencies]
bootloader = {version = "0.9.23", features = ["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.14.2"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.5.0"
linked_list_allocator = "0.9.0"

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[dependencies.crossbeam-queue]
version = "0.2.1"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false


[package.metadata.bootimage] #  bootimage runner adds these arguments to the QEMU command for tests
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04","-serial","stdio","-display","none"] # iobase parameter specifies the port address the device should live (f4 should be unused)
test-success-exit-code = 33  # (0x10 << 1) | 1 maps our exit code to 0 so that cargo test correctly recognisses the success case
test-timeout = 300 # seconds
run-args = ["-serial","stdio"]

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
